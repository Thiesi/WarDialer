name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install "pytest>=7.0" "pytest-xdist>=3.0" tzdata
      - name: Standard library only
        run: python -I tools/check_stdlib_only.py
      - name: Tests
        run: python -m pytest -q -n auto
      - name: Input timing tests (serial)
        run: python -m pytest -q -m timing_sensitive
